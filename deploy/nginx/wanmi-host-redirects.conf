# The production certificate mounted here must cover wanmi.ai, www.wanmi.ai,
# and www.wanmi.net. The canonical wanmi.net HTTPS virtual host is configured
# separately by the application proxy and is intentionally absent here.
server {
    listen 80;
    listen [::]:80;
    server_name wanmi.net wanmi.ai www.wanmi.ai www.wanmi.net;

    return 301 https://wanmi.net$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wanmi.ai www.wanmi.ai www.wanmi.net;

    ssl_certificate /etc/nginx/tls/wanmi/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/wanmi/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://wanmi.net$request_uri;
}
