[extend]
useDefault = true

[[rules]]
id = "wanmi-provider-secret-assignment"
description = "Wanmi provider secrets must never be assigned in repository-visible files"
regex = '''(?i)(WESTDIGITAL_API_PASSWORD|WECHATPAY_API_V3_KEY|WECHATPAY_MERCHANT_PRIVATE_KEY)[ \t]*=[ \t]*["']?([^\s"'#]{8,})'''
secretGroup = 2
keywords = ["WESTDIGITAL_API_PASSWORD", "WECHATPAY_API_V3_KEY", "WECHATPAY_MERCHANT_PRIVATE_KEY"]

[[rules]]
id = "wanmi-realname-master-key-assignment"
description = "Wanmi real-name document master keys must never be assigned in repository-visible files"
regex = '''(?i)(REALNAME_DOCUMENT_MASTER_KEYS)[ \t]*=[ \t]*["']?([A-Za-z0-9][A-Za-z0-9._-]{0,63}:[A-Za-z0-9+/]{43}=)'''
secretGroup = 2
keywords = ["REALNAME_DOCUMENT_MASTER_KEYS"]

[allowlist]
description = "Generated/local-only files excluded from repository secret evidence"
paths = [
  '''(^|/)\.git/''',
  '''(^|/)\.next/''',
  '''(^|/)node_modules/''',
  '''^apps/web/\.env\.local$''',
  '''^apps/web/coverage/''',
  '''^apps/web/playwright-report/''',
  '''^apps/web/test-results/''',
]
