name: ci

permissions:
  contents: read

on:
  pull_request:
  # Branch pushes are covered by pull_request; keeping codex/** here ran the same
  # job twice per pull request. main stays so merges are verified post-merge.
  push:
    branches: [main]

# A new push supersedes an in-flight run for the same ref. main is never cancelled
# so every merged commit keeps a completed check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://wanmi:wanmi_local_only@127.0.0.1:55432/wanmi
      NEXT_PUBLIC_SERVER_URL: http://127.0.0.1:3000
      PAYLOAD_SECRET: ci-payload-secret-ci-payload-secret
      SESSION_PEPPER: ci-session-pepper-ci-session-pepper
      TOTP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      PUBLIC_STORAGE_MODE: local
      ALIYUN_SMS_MODE: mock
      ALIYUN_OSS_REALNAME_MODE: mock
      ALLOW_REAL_PROVIDER_WRITES: 'false'
      ALLOW_REAL_ALIYUN_OSS_REALNAME: 'false'
      ALLOW_REAL_ALIYUN_SMS_SENDS: 'false'
      ALLOW_REAL_WECHAT_OFFICIAL_MESSAGES: 'false'
      ALLOW_REAL_WECHATPAY: 'false'
      ALLOW_REAL_WECHATPAY_PAYMENTS: 'false'
      ALLOW_REAL_WECHATPAY_REFUNDS: 'false'
      ALLOW_REAL_WESTDIGITAL: 'false'
      ALLOW_REAL_WESTDIGITAL_READS: 'false'
      ALLOW_REAL_WESTDIGITAL_REALNAME_WRITES: 'false'
      ALLOW_REAL_WESTDIGITAL_REGISTRATION_WRITES: 'false'
      ALLOW_REAL_WESTDIGITAL_RENEWAL_WRITES: 'false'
      ALLOW_REAL_WESTDIGITAL_NAMESERVER_WRITES: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine validation tier
        id: validation
        shell: bash
        env:
          VALIDATION_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          VALIDATION_DIFF_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          scope=full
          if detected_scope="$(node scripts/ci-validation-scope.mjs --base "$VALIDATION_DIFF_BASE_SHA" --head "$VALIDATION_DIFF_HEAD_SHA")"; then
            if [ "$detected_scope" = docs ]; then
              scope=docs
            fi
          else
            echo "::warning::Diff classification failed; running the full validation gate."
          fi
          printf 'scope=%s\n' "$scope" >> "$GITHUB_OUTPUT"
          printf 'Selected validation scope: %s\n' "$scope"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Generate ephemeral real-name document master key
        if: steps.validation.outputs.scope == 'full'
        shell: bash
        run: |
          printf 'REALNAME_DOCUMENT_MASTER_KEY_VERSION=ci-v1\n' >> "$GITHUB_ENV"
          printf 'REALNAME_DOCUMENT_MASTER_KEYS=ci-v1:%s\n' "$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
      - run: corepack enable && corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Run documentation gate
        if: steps.validation.outputs.scope == 'docs'
        env:
          VALIDATION_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          VALIDATION_DIFF_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: make check-docs
      - name: Start PostgreSQL for the full gate
        if: steps.validation.outputs.scope == 'full'
        run: docker compose up -d --wait --wait-timeout 60 postgres
      - name: Apply migrations before the full gate
        if: steps.validation.outputs.scope == 'full'
        run: pnpm --filter @wanmi/web payload migrate
      - name: Run full gate
        if: steps.validation.outputs.scope == 'full'
        run: make check
      - name: Install Chromium for performance verification
        if: steps.validation.outputs.scope == 'full'
        run: pnpm --filter @wanmi/web exec playwright install --with-deps chromium
      - name: Run performance verification
        if: steps.validation.outputs.scope == 'full'
        run: make performance
        timeout-minutes: 15
