name: wanmi-d0

services:
  postgres:
    image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    environment:
      POSTGRES_DB: wanmi
      POSTGRES_PASSWORD: wanmi_local_only
      POSTGRES_USER: wanmi
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U wanmi -d wanmi']
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - wanmi-postgres:/var/lib/postgresql/data

  whodat:
    image: lissy93/who-dat:v2.0.0@sha256:7bbfe95c6bc5aa6d7aeac033812621a30cc54d1208ab8e7bf9ce9318029e133a
    environment:
      AUTH_KEY: local-who-dat-only
      CACHE_TTL_SECONDS: 3600
      ENABLE_CACHE: 'true'
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - '127.0.0.1:8080:8080'
    dns:
      - 1.1.1.1
      - 8.8.8.8
    logging:
      driver: local
      options:
        max-file: '3'
        max-size: 10m

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: wanmi-minio
      MINIO_ROOT_PASSWORD: wanmi-minio-local-only
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 3s
      timeout: 5s
      retries: 30
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - wanmi-minio:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mc alias set local http://minio:9000 wanmi-minio wanmi-minio-local-only &&
        mc mb --ignore-existing local/wanmi-public &&
        mc anonymous set none local/wanmi-public

volumes:
  wanmi-minio:
  wanmi-postgres:
